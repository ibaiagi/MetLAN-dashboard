<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <title>MetLAN Dashboard</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header>
    <h1>MetLAN</h1>
    <span id="date"></span>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="devices">Devices</button>
    <button class="tab-btn" data-tab="stats">Statistics</button>
  </nav>

  <main>
    <section class="card" id="clients-card" data-panel="devices">
      <h2>Connected devices</h2>
      <div class="table-scroll">
        <table id="clients-table">
          <thead>
            <tr><th>IP</th><th>MAC</th><th>Device name</th><th>Vendor</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="card" id="stats-card" data-panel="stats" hidden>
      <h2>Interface throughput</h2>
      <div class="table-scroll">
        <table id="stats-table">
          <thead>
            <tr><th>Interface</th><th>Download</th><th>Upload</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="card" id="system-card" data-panel="stats" hidden>
      <h2>System</h2>
      <div class="table-scroll">
        <table id="system-table">
          <thead>
            <tr><th>Metric</th><th>Value</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
