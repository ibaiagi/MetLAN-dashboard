# Restart-on-failure for dnsmasq - it has none by default, so a startup
# race or crash otherwise leaves DNS silently dead until someone notices
# (confirmed 2026-09-23: an "unknown interface eth0" boot race killed it
# for over an hour with no recovery). Install as a drop-in, not by editing
# the packaged unit file directly:
#   sudo mkdir -p /etc/systemd/system/dnsmasq.service.d
#   sudo cp system/dnsmasq-override.conf /etc/systemd/system/dnsmasq.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart dnsmasq

[Service]
Restart=on-failure
RestartSec=5
