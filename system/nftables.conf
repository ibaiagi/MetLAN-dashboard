#!/usr/sbin/nft -f
# MetLAN Pi router ruleset - NAT + forwarding, eth0 (LAN/testbench) -> eth1 (dongle/WAN).
# Install: sudo cp system/nftables.conf /etc/nftables.conf && sudo systemctl restart nftables
# See system/README.md before enabling this on anything but the isolated testbench.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy accept;
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        iifname "eth0" oifname "eth1" accept
        iifname "eth1" oifname "eth0" ct state established,related accept
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100;

        oifname "eth1" masquerade
    }
}
