# MetLAN Pi router - DHCP + DNS for eth0 (LAN/testbench).
# Install: sudo cp system/dnsmasq-metlan.conf /etc/dnsmasq.d/metlan.conf && sudo systemctl restart dnsmasq
# See system/README.md before enabling this on anything but the isolated testbench.

interface=eth0
bind-interfaces

dhcp-range=10.42.0.10,10.42.0.200,12h
dhcp-option=option:router,10.42.0.1
dhcp-option=option:dns-server,10.42.0.1

no-resolv
server=1.1.1.1
server=8.8.8.8
